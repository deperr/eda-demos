---

- name: Listen for STIG File Changes
  hosts: all
  sources:
    - ansible.eda.kafka:
        host: web03.dperrone.dev
        port: 9092
        topic: eda-topic
        group_id: eda-demo-group

  rules:

    - name: Catch Everything and Print to Log
      condition: true
      action:
        debug:
          msg: "RAW AAP EVENT PAYLOAD: {{ event }}"


    - name: Detect activity on /etc/shadow
      condition: event.message is search("shadow")
      action:
        run_job_template:
          name: "EDA | STIG Remediation" 
          organization: "Default"
          job_args:
            extra_vars:
              target_server: "{{ event.host.name }}"
              offending_message: "{{ event.message }}"
