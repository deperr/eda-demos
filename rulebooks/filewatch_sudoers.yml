---

- name: Monitor sudoers file for modifications
  hosts: all
  sources:
    - ansible.eda.file_watch:
        path: /tmp
        recursive: false

  rules:
    - name: Sudoers file was modified
      condition: event.type == "FileModifiedEvent" or event.type == "FileCreatedEvent"
      actions:
        - debug:
            msg: "ALERT: {{ event.src_path }} was modified on {{ event.meta.hosts }}"
        - run_job_template:
            name: "EDA | Remediate Sudoers Change"
            organization: "Default"
