---
- name: Deploy EDA Event Source Stack on web server
  hosts: "{{ _hosts | default(omit) }}"
  become: true
  vars:
    kafka_version: "3.7.0"
    kafka_scala_version: "2.13"
    kafka_install_dir: "/opt/kafka"
    # A unique ID for the Kafka KRaft cluster
    cluster_id: "REhBLUVEQS1IQU1FLUxBQi0yMDI2"

  tasks:
    ## --- SECTION 1: KAFKA INSTALLATION --- ##
    
    - name: Install Java 17
      ansible.builtin.dnf:
        name: java-17-openjdk-headless
        state: present

    - name: Create kafka group
      ansible.builtin.group:
        name: kafka
        state: present

    - name: Create kafka user
      ansible.builtin.user:
        name: kafka
        group: kafka
        shell: /sbin/nologin
        state: present

    - name: Download and Unarchive Kafka
      ansible.builtin.unarchive:
        src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
        dest: /opt
        remote_src: yes
        owner: kafka
        group: kafka
        creates: "/opt/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"

    - name: Create symlink to /opt/kafka
      ansible.builtin.file:
        src: "/opt/kafka_{{ kafka_scala_version }}-{{ kafka_version }}"
        dest: "{{ kafka_install_dir }}"
        state: link

    - name: Format Kafka Storage (KRaft Mode)
      ansible.builtin.command:
        cmd: "{{ kafka_install_dir }}/bin/kafka-storage.sh format -t {{ cluster_id }} -c {{ kafka_install_dir }}/config/kraft/server.properties"
      become_user: kafka
      args:
        creates: "{{ kafka_install_dir }}/logs/meta.properties"

    - name: Create Kafka Systemd Service
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        content: |
          [Unit]
          Description=Apache Kafka Server
          After=network.target

          [Service]
          Type=simple
          User=kafka
          Group=kafka
          Environment="KAFKA_HEAP_OPTS=-Xmx512M -Xms512M"
          ExecStart={{ kafka_install_dir }}/bin/kafka-server-start.sh {{ kafka_install_dir }}/config/kraft/server.properties
          ExecStop={{ kafka_install_dir }}/bin/kafka-server-stop.sh
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: Reload Systemd

    - name: Ensure Kafka is running
      ansible.builtin.systemd:
        name: kafka
        state: started
        enabled: true

    ## --- SECTION 2: FILEBEAT INSTALLATION --- ##

    - name: Import Elastic GPG Key
      ansible.builtin.rpm_key:
        state: present
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch

    - name: Add Elastic RPM Repository
      ansible.builtin.yum_repository:
        name: elastic-8.x
        description: Elastic repository for 8.x packages
        baseurl: https://artifacts.elastic.co/packages/8.x/yum
        gpgcheck: yes
        gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        enabled: yes

    - name: Install Filebeat
      ansible.builtin.dnf:
        name: filebeat
        state: present

    - name: Configure Filebeat for Kafka Output
      ansible.builtin.copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /etc/sudoers
              - /etc/hosts
          
          output.kafka:
            hosts: ["localhost:9092"]
            topic: "system-events"
          
          logging.level: info
      notify: Restart Filebeat

    - name: Ensure Filebeat is running
      ansible.builtin.systemd:
        name: filebeat
        state: started
        enabled: true

  handlers:
    - name: Reload Systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted
