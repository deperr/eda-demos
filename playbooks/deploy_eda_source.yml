---
- name: Deploy EDA Event Source Stack on web server
  hosts: "{{ _hosts | default(omit) }}"
  become: false
  vars:
    kafka_image: "docker.io/apache/kafka:latest"
    filebeat_image: "docker.elastic.co/beats/filebeat:8.12.0"
    cluster_id: "MkU3OEVBNTcwNTJENDM2Qk"
    advertised_hostname: "{{ _hosts }}"
    filebeat_conf_dir: "{{ ansible_user_dir }}/filebeat-config"
    kafka_topic: "eda-events"

  tasks:

    - name: Ensure Podman is installed
      become: true
      ansible.builtin.dnf:
        name: podman
        state: present

    - name: Grant user search access to audit directory
      become: true
      ansible.posix.acl:
        path: /var/log/audit
        entity: "{{ ansible_user_id }}"
        etype: user
        permissions: rx
        state: present

    - name: Grant user read access to specific logs
      become: true
      ansible.posix.acl:
        path: "{{ item }}"
        entity: "{{ ansible_user_id }}"
        etype: user
        permissions: r
        state: present
      loop:
        - /var/log/messages
        - /var/log/secure
        - /var/log/audit/audit.log


    - name: Create persistent volume for Kafka
      containers.podman.podman_volume:
        name: kafka_data
        state: present

    - name: Run Official Apache Kafka (KRaft Mode)
      containers.podman.podman_container:
        name: "kafka-eda"
        image: "{{ kafka_image }}"
        state: started
        recreate: yes
        restart_policy: always
        ports:
          - "9092:9092"
        env:
          # Node configuration
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CLUSTER_ID: "{{ cluster_id }}"
          # Networking
          KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://{{ advertised_hostname }}:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          # EDA Optimization: Allow auto-creation of topics
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volume:
          - "kafka_data:/var/lib/kafka/data:Z"

    - name: Create Filebeat directory in home
      ansible.builtin.file:
        path: "{{ filebeat_conf_dir }}"
        state: directory
        mode: '0755'

    - name: Configure Filebeat
      ansible.builtin.copy:
        dest: "{{ filebeat_conf_dir }}/filebeat.yml"
        mode: '0600'
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /var/log/host_logs/*.log
          
          output.kafka:
            hosts: ["web02.dperrone.dev:9092"]
            topic: "{{ kafka_topic }}"

    - name: Run Filebeat Container
      become: true
      containers.podman.podman_container:
        name: filebeat-eda
        image: "{{ filebeat_image }}"
        user: root 
        state: started
        recreate: yes
        restart_policy: always
        # Add this line to bypass SELinux confinement for this container
        security_opt:
          - "label=disable"
        volume:
          - "{{ filebeat_conf_dir }}/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro,Z"
          - "/var/log:/var/log/host_logs:ro"
          - "filebeat_data:/usr/share/filebeat/data:Z"

    - name: Wait for Kafka to respond on 9092
      ansible.builtin.wait_for:
        port: 9092
        host: "{{ advertised_hostname }}"
        timeout: 60
