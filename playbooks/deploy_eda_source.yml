---
- name: Deploy EDA Event Source Stack on web server
  hosts: "{{ _hosts | default(omit) }}"
  become: false
  vars:
    kafka_image: "docker.io/apache/kafka:latest"
    container_name: "kafka-eda"
    cluster_id: "MkU3OEVBNTcwNTJENDM2Qk"
    advertised_hostname: "web03.dperrone.dev"

  tasks:

    - name: Stop and remove existing Kafka container if it exists
      containers.podman.podman_container:
        name: "{{ container_name }}"
        state: absent
        stop_time: 10

    - name: Remove stale data directories and logs
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/var/lib/kafka"
        - "/var/lib/zookeeper"
        - "/tmp/kafka-logs"
        - "/tmp/zookeeper"

    - name: Ensure Podman is installed
      become: true
      ansible.builtin.dnf:
        name: podman
        state: present

    - name: Create persistent volume for Kafka
      containers.podman.podman_volume:
        name: kafka_data
        state: present

    - name: Run Official Apache Kafka (KRaft Mode)
      containers.podman.podman_container:
        name: "{{ container_name }}"
        image: "{{ kafka_image }}"
        state: started
        recreate: yes
        restart_policy: always
        ports:
          - "9092:9092"
        env:
          # Node configuration
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CLUSTER_ID: "{{ cluster_id }}"
          # Networking
          KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://{{ advertised_hostname }}:9092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          # EDA Optimization: Allow auto-creation of topics
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volume:
          - "kafka_data:/var/lib/kafka/data:Z"

    - name: Wait for Kafka to respond on 9092
      ansible.builtin.wait_for:
        port: 9092
        host: "{{ advertised_hostname }}"
        timeout: 60
