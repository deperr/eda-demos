---

- name: Setup Event-Driven Ansible Demo (Kafka & Filebeat)
  hosts: all
  become: true
  vars:
    kafka_version: "3.7.0"
    scala_version: "2.13"
    kafka_dir: "/opt/kafka"
    kafka_data_dir: "/var/lib/kafka-logs"
    kafka_user: "kafka"
    kafka_topic: "eda-topic"
    # Uses the node's primary network IP so AAP can reach it
    kafka_bind_ip: "{{ ansible_default_ipv4.address }}"
    
  tasks:
    # ==========================================
    # KAFKA SETUP (KRaft Mode)
    # ==========================================
    - name: Install Java (OpenJDK 17) and archiving tools
      ansible.builtin.dnf:
        name: 
          - java-17-openjdk
          - tar
          - gzip
        state: present

    - name: Create Kafka group
      ansible.builtin.group:
        name: "{{ kafka_user }}"
        state: present

    - name: Create Kafka user
      ansible.builtin.user:
        name: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        system: true
        create_home: false

    - name: Create Kafka installation and data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        mode: '0755'
      loop:
        - "{{ kafka_dir }}"
        - "{{ kafka_data_dir }}"

    - name: Download and extract Apache Kafka (From Permanent Archive)
      ansible.builtin.unarchive:
        src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_{{ scala_version }}-{{ kafka_version }}.tgz"
        dest: "{{ kafka_dir }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        owner: "{{ kafka_user }}"
        group: "{{ kafka_user }}"
        creates: "{{ kafka_dir }}/bin/kafka-server-start.sh"

    - name: Configure KRaft properties (Network, IP, and Logging)
      ansible.builtin.lineinfile:
        path: "{{ kafka_dir }}/config/kraft/server.properties"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^log\.dirs='
          line: 'log.dirs={{ kafka_data_dir }}'
        - regexp: '^listeners='
          line: 'listeners=PLAINTEXT://{{ kafka_bind_ip }}:9092,CONTROLLER://{{ kafka_bind_ip }}:9093'
        - regexp: '^#?advertised\.listeners='
          line: 'advertised.listeners=PLAINTEXT://{{ kafka_bind_ip }}:9092'
        - regexp: '^controller\.quorum\.voters='
          line: 'controller.quorum.voters=1@{{ kafka_bind_ip }}:9093'

    - name: Check if KRaft storage is already formatted
      ansible.builtin.stat:
        path: "{{ kafka_data_dir }}/meta.properties"
      register: kraft_meta

    - name: Generate Kafka Cluster UUID
      ansible.builtin.command: "{{ kafka_dir }}/bin/kafka-storage.sh random-uuid"
      register: kafka_uuid
      when: not kraft_meta.stat.exists
      become_user: "{{ kafka_user }}"

    - name: Format KRaft storage
      ansible.builtin.command: >
        {{ kafka_dir }}/bin/kafka-storage.sh format 
        -t {{ kafka_uuid.stdout }} 
        -c {{ kafka_dir }}/config/kraft/server.properties
      when: not kraft_meta.stat.exists
      become_user: "{{ kafka_user }}"

    - name: Create Kafka systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/kafka.service
        content: |
          [Unit]
          Description=Apache Kafka Server (KRaft)
          Documentation=http://kafka.apache.org/documentation.html
          Requires=network.target
          After=network.target

          [Service]
          Type=simple
          User={{ kafka_user }}
          Group={{ kafka_user }}
          Environment="KAFKA_HEAP_OPTS=-Xmx1G -Xms1G"
          ExecStart={{ kafka_dir }}/bin/kafka-server-start.sh {{ kafka_dir }}/config/kraft/server.properties
          ExecStop={{ kafka_dir }}/bin/kafka-server-stop.sh
          Restart=on-abnormal

          [Install]
          WantedBy=multi-user.target
        mode: '0644'
      notify: Reload systemd

    - name: Start and enable Kafka service
      ansible.builtin.systemd:
        name: kafka
        state: started
        enabled: true
        daemon_reload: true

    # ==========================================
    # FILEBEAT SETUP
    # ==========================================
    - name: Import Elastic GPG Key
      ansible.builtin.rpm_key:
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        state: present

    - name: Add Elastic Yum Repository
      ansible.builtin.yum_repository:
        name: elastic-8.x
        description: Elastic repository for 8.x packages
        baseurl: https://artifacts.elastic.co/packages/8.x/yum
        gpgcheck: true
        gpgkey: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        enabled: true

    - name: Install Filebeat
      ansible.builtin.dnf:
        name: filebeat
        state: present

    - name: Configure Filebeat (Send STIG/auditd logs to Kafka)
      ansible.builtin.copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
            - type: filestream
              id: syslogs
              enabled: true
              paths:
                - /var/log/messages
                - /var/log/secure
                - /var/log/audit/audit.log

          # Drop default Elasticsearch output and configure Kafka
          output.kafka:
            hosts: ["{{ kafka_bind_ip }}:9092"]
            topic: '{{ kafka_topic }}'
            partition.round_robin:
              reachable_only: false
            required_acks: 1
            compression: gzip
            max_message_bytes: 1000000
        owner: root
        group: root
        mode: '0600'
      notify: Restart Filebeat

    - name: Start and enable Filebeat service
      ansible.builtin.systemd:
        name: filebeat
        state: started
        enabled: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart Filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted