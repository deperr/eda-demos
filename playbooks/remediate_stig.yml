---

- name: STIG Remediation Action
  hosts: "{{ target_server }}"
  become: true

  vars:
    stig_remediation_map:
      sshd_config_monitor: sshd.yml
      sshd_config_d_monitor: sshd.yml
      login_defs_monitor: login_defs.yml
      sysctl_monitor: sysctl.yml
      sysctl_d_monitor: sysctl.yml

  tasks:

    - name: Show raw event for troubleshooting
      ansible.builtin.debug:
        msg: "RAW EVENT: {{ offending_message }}"

    - name: Extract the audit key from the EDA payload
      ansible.builtin.set_fact:
        audit_key: >-
          {{ offending_message | regex_search('key="(\w+_monitor)"', '\1') | default(['unknown'], true) | first }}

    - name: Log the incident locally
      ansible.builtin.command: >-
        logger 'AAP Automated Remediation triggered for audit key={{ audit_key }} on {{ inventory_hostname }}'

    - name: Show the event data in the AAP Job Logs
      ansible.builtin.debug:
        msg: >
          An unauthorized change was detected on {{ inventory_hostname }}.
          Audit key: {{ audit_key }}.
          Remediation task: {{ stig_remediation_map[audit_key] | default('none - manual review required') }}.
          Raw event: {{ offending_message }}

    - name: Run targeted STIG remediation
      when: audit_key in stig_remediation_map
      ansible.builtin.include_role:
        name: stig_hardening
        tasks_from: "{{ stig_remediation_map[audit_key] }}"

    - name: Alert on changes with no auto-remediation
      when: audit_key not in stig_remediation_map
      ansible.builtin.debug:
        msg: >
          STIG ALERT: Change detected (key={{ audit_key }}) on {{ inventory_hostname }}.
          No auto-remediation template available - manual review required.
