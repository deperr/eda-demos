---

- name: Insert benign comment into sudoers to trigger EDA
  hosts: all
  gather_facts: false
  become: true

  tasks:
    - name: Add a benign comment to /etc/sudoers
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "## EDA Demo - this comment triggers the filewatch rule"
        insertafter: EOF
        validate: visudo -cf %s

    - name: Confirm modification was made
      ansible.builtin.debug:
        msg: "/etc/sudoers has been modified - filewatch rule should trigger"
