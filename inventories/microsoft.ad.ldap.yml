plugin: microsoft.ad.ldap

# Use the lookup plugin to pull the server from the environment variable
server: "{{ lookup('env', 'AD_LDAP_SERVER') }}"
bind_dn: "{{ lookup('env', 'AD_BIND_DN') }}"
password: "{{ lookup('env', 'AD_BIND_PASSWORD') }}"

search_base: "OU=Computers,DC=dperrone,DC=dev"

# The rest of your config remains the same...
keyed_groups:
  - prefix: ad
    key: operatingSystem